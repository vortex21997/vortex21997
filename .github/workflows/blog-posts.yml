name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://vortex21997.github.io/feed.xml"
          max_post_count: 5
          template: "$newline- [$title]($url) <sub>$date</sub>"
          date_format: "yyyy.mm.dd"
